<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Lets an iPhone add the app to its home screen as a standalone app, which is the
         only way iOS delivers web push. The manifest deliberately has no start_url: the
         installed app then opens at the address it was added from, keeping the table, and
         browsers that would otherwise advertise an install (Chrome) don't treat it as
         installable. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Foosball" />
    <meta name="color-scheme" content="light dark" />
    <!-- The page's colour before the app has loaded, so a dark-theme visit doesn't open on
         a white flash. The script applies a theme the player pinned (see src/theme.ts, which
         owns the "foosball:theme" key and the data-theme attribute). -->
    <script>
      try {
        var theme = localStorage.getItem("foosball:theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch (error) {
        /* Storage unavailable: follow the device. */
      }
    </script>
    <style>
      html {
        background: #edf1ea;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) {
          background: #11140f;
        }
      }
      html[data-theme="dark"] {
        background: #11140f;
      }
    </style>
    <title>Foosball Matchmaker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
